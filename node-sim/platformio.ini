; Three simulated parking nodes, one env per physical board.
; Flash each board with its own env: pio run -e node1 -t upload

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = knolleary/PubSubClient@^2.8

[env:node1]
build_flags = -D NODE_ID=1

[env:node2]
build_flags = -D NODE_ID=2

[env:node3]
build_flags = -D NODE_ID=3
