<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Parking Monitor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Spot A — Live Monitor</h1>

        <!-- Shown when the API is unreachable. The elapsed timer stops at the
             same time so the page never displays a fabricated duration. -->
        <div id="conn-banner" class="conn-banner hidden"></div>

        <!-- Live status -->
        <div class="realtime-section">
            <div id="duration" class="duration">--:--:--</div>
            <div id="spot-box" class="spot-box idle">
                <span id="spot-text">Vacant</span>
            </div>
            <div class="vote-info">
                <span id="vote-text">0/3</span>
                <span id="vote-warning" class="warning hidden">Node down</span>
                <!-- On a tied vote the gateway holds the previous state, so
                     1/2 alongside "occupied" is legitimate rather than a bug. -->
                <span id="tie-hint" class="tie-hint hidden">Tied &middot; holding previous state</span>
            </div>
        </div>

        <!-- History -->
        <div class="history-section">
            <h2>Occupancy, past 10 hours</h2>
            <canvas id="timeline" width="900" height="60"></canvas>
            <div class="time-labels">
                <span id="time-start">--:--</span>
                <span id="time-end">--:--</span>
            </div>
            <div class="legend">
                <span><i class="sw sw-occupied"></i>Occupied</span>
                <span><i class="sw sw-idle"></i>Vacant</span>
                <span><i class="sw sw-nodata"></i>No data (gateway down or all nodes offline)</span>
            </div>

            <h3>Parking sessions</h3>
            <table id="session-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Node health -->
        <div class="nodes-section">
            <h2>Node health</h2>
            <div id="node-list" class="node-list"></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
