<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能停车监测 Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>车位 A 实时监测</h1>

        <!-- 连接中断提示。断连时页面会停止走表，避免显示编造的时长 -->
        <div id="conn-banner" class="conn-banner hidden"></div>

        <!-- 实时状态区 -->
        <div class="realtime-section">
            <div id="duration" class="duration">--:--:--</div>
            <div id="spot-box" class="spot-box idle">
                <span id="spot-text">空闲</span>
            </div>
            <div class="vote-info">
                <span id="vote-text">0/3</span>
                <span id="vote-warning" class="warning hidden">节点异常</span>
                <!-- 票数打平时网关保持上一状态，会出现 1/2 却显示占用 -->
                <span id="tie-hint" class="tie-hint hidden">持平 · 维持上一状态</span>
            </div>
        </div>

        <!-- 历史视图区 -->
        <div class="history-section">
            <h2>过去 10 小时占用记录</h2>
            <canvas id="timeline" width="900" height="60"></canvas>
            <div class="time-labels">
                <span id="time-start">--:--</span>
                <span id="time-end">--:--</span>
            </div>
            <div class="legend">
                <span><i class="sw sw-occupied"></i>占用</span>
                <span><i class="sw sw-idle"></i>空闲</span>
                <span><i class="sw sw-nodata"></i>无数据（网关停机或节点全部离线）</span>
            </div>

            <h3>停车会话列表</h3>
            <table id="session-table">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>开始时间</th>
                        <th>结束时间</th>
                        <th>停车时长</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- 节点健康区 -->
        <div class="nodes-section">
            <h2>节点健康状态</h2>
            <div id="node-list" class="node-list"></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
