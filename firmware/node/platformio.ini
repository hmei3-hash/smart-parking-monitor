; Three real parking nodes, one env per physical board.
; Flash: pio run -e node1 -t upload   (node2, node3 for other boards)

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; ---- N16R8: 16MB flash + 8MB octal PSRAM ----
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -I../../model/tflite

lib_deps =
    https://github.com/tanakamasayuki/Arduino_TensorFlowLite_ESP32/archive/refs/heads/master.zip
    knolleary/PubSubClient@^2.8

[env:node1]
build_flags =
    ${env.build_flags}
    -D NODE_ID=1

[env:node2]
build_flags =
    ${env.build_flags}
    -D NODE_ID=2

[env:node3]
build_flags =
    ${env.build_flags}
    -D NODE_ID=3